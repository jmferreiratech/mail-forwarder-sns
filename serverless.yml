service: mail-forwarder-sns

plugins:
  - serverless-esbuild

custom:
  topicName: 'mail-forwarder-${self:provider.stage}'
  esbuild:
    packager: yarn
    minify: true
    sourcemap: true
    concurrency: 3
    zipConcurrency: 3
    nativeZip: true
    exclude: ['@aws-sdk/*']

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'sns'}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - ses:SendEmail
        - ses:SendRawEmail
      Resource: "*"
  environment:
    to_address: ${file(./config.yml):to}

functions:
  forwarder:
    handler: index.handler
    events:
      - sns:
          arn: !Ref MailSNSTopic
          topicName: ${self:custom.topicName}

resources:
  Resources:
    MailSNSTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:custom.topicName}
    MailRuleSet:
      Type: AWS::SES::ReceiptRuleSet
    MailRule:
      Type: AWS::SES::ReceiptRule
      Properties:
        Rule:
          Actions:
            - SNSAction:
                Encoding: UTF-8
                TopicArn: !Ref MailSNSTopic
          Enabled: true
          Recipients: ${file(./config.yml):recipients}
          ScanEnabled: true
        RuleSetName: !Ref MailRuleSet
